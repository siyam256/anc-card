<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANC কার্ড</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#141c2e;--mut:#6b7488;--line:#e3e8f1;--blue:#2b8ef0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--panel:#131b2f;--ink:#f1f4fa;--mut:#8f9bb3;--line:#222c45}}
:root[data-theme="dark"]{--bg:#0b1020;--panel:#131b2f;--ink:#f1f4fa;--mut:#8f9bb3;--line:#222c45}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:28px 18px 40px}
header{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.brand{font-family:'Plus Jakarta Sans','Hind Siliguri',sans-serif;font-weight:800;font-size:22px;letter-spacing:-.3px}
.brand b{color:var(--blue)}
h1{font-size:15px;font-weight:600;color:var(--mut);margin:0 0 0 auto}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:760px){.grid{grid-template-columns:340px 1fr;align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 8px;font-weight:600}
input[type=text]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:600 16px 'Hind Siliguri',sans-serif;outline:none}
input[type=text]:focus{border-color:var(--blue)}
.up{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:16px;cursor:pointer;color:var(--mut);font-weight:600;font-size:14px;margin-bottom:18px;transition:.2s}
.up:hover{border-color:var(--blue);color:var(--blue)}
.up input{display:none}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#2b8ef0;color:#fff;font:700 16px 'Hind Siliguri',sans-serif;cursor:pointer}
button:disabled{opacity:.5}
.prev{display:flex;justify-content:center}
canvas{width:100%;max-width:700px;height:auto;border-radius:18px;box-shadow:0 20px 50px -18px rgba(11,17,32,.45)}
.hint{font-size:12px;color:var(--mut);margin-top:10px;text-align:center;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">ANC <b>কার্ড</b></div>
    <h1>Admission News Corner</h1>
  </header>
  <div class="grid">
    <div class="panel">
      <label>প্রোফাইল ছবি</label>
      <label class="up" for="pic"><span id="upt">ছবি সিলেক্ট করুন</span><input id="pic" type="file" accept="image/*"></label>
      <label for="nm">আপনার নাম</label>
      <input id="nm" type="text" placeholder="নাম লিখুন" maxlength="40" autocomplete="off">
      <button id="dl">কার্ড ডাউনলোড করুন</button>
      <div class="hint" id="msg"></div>
    </div>
    <div class="prev"><canvas id="cv" width="1400" height="800"></canvas></div>
  </div>
</div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=1400,H=800;
var NAVY='#141c2e',BLUE='#2b8ef0',img=null,fontsReady=false;
var nm=document.getElementById('nm'),pic=document.getElementById('pic'),msg=document.getElementById('msg');

function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f2f8ff');g.addColorStop(1,'#ffffff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // left accent panel
  ctx.fillStyle='#eaf3fe';ctx.beginPath();ctx.arc(330,400,420,0,7);ctx.fill();
  ctx.fillStyle=BLUE;ctx.fillRect(0,0,16,H);

  // photo
  var cx=330,cy=400;
  ctx.lineWidth=4;ctx.strokeStyle='rgba(43,142,240,.25)';
  ctx.beginPath();ctx.arc(cx,cy,246,0,7);ctx.stroke();
  ctx.lineWidth=10;ctx.strokeStyle=BLUE;
  ctx.beginPath();ctx.arc(cx,cy,218,0,7);ctx.stroke();
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,198,0,7);ctx.clip();
  if(img){
    var s=Math.max(396/img.width,396/img.height),w=img.width*s,h=img.height*s;
    ctx.drawImage(img,cx-w/2,cy-h/2,w,h);
  }else{
    ctx.fillStyle='#dcebfc';ctx.fillRect(cx-198,cy-198,396,396);
    ctx.fillStyle='rgba(43,142,240,.45)';
    ctx.beginPath();ctx.arc(cx,cy-30,62,0,7);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx,cy+150,115,95,0,0,7);ctx.fill();
  }
  ctx.restore();

  // wordmark
  ctx.textBaseline='alphabetic';ctx.textAlign='left';
  ctx.font='800 56px "Plus Jakarta Sans","Hind Siliguri",sans-serif';
  ctx.fillStyle=NAVY;ctx.fillText('Admission',680,130);
  ctx.fillStyle=BLUE;ctx.fillText('News',680,192);
  var nw=ctx.measureText('News ').width;
  ctx.fillStyle=NAVY;ctx.fillText('Corner',680+nw,192);
  ctx.strokeStyle=BLUE;ctx.lineWidth=13;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(1230,92);ctx.lineTo(1300,92);ctx.lineTo(1300,162);ctx.stroke();

  // name
  var has=(nm.value||'').trim(),name=has||'আপনার নাম';
  var size=88;
  do{ctx.font='700 '+size+'px "Hind Siliguri","Plus Jakarta Sans",sans-serif';size-=2;}while(ctx.measureText(name).width>640&&size>30);
  ctx.fillStyle=has?NAVY:'#b7c3d6';
  ctx.fillText(name,680,470);
  ctx.fillStyle=BLUE;ctx.fillRect(680,505,90,7);

  // footer
  ctx.font='500 24px "Plus Jakarta Sans",sans-serif';
  ctx.fillStyle='#8a97ad';
  if(ctx.letterSpacing!==undefined)ctx.letterSpacing='7px';
  ctx.fillText('ANC CARD',680,700);
  if(ctx.letterSpacing!==undefined)ctx.letterSpacing='0px';
  ctx.fillStyle=BLUE;ctx.fillRect(0,H-12,W,12);
}

pic.addEventListener('change',function(){
  var f=pic.files&&pic.files[0];if(!f)return;
  var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){img=im;document.getElementById('upt').textContent='ছবি বদলান';draw();};
  im.src=u;
});
nm.addEventListener('input',draw);

function filename(){var n=(nm.value||'').trim().replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'')||'card';return 'ANC-'+n+'.png';}

document.getElementById('dl').addEventListener('click',async function(){
  draw();
  var blob=await new Promise(function(r){cv.toBlob(r,'image/png');});
  if(!blob){msg.textContent='কার্ড তৈরি হয়নি, আবার চেষ্টা করুন';return;}
  try{
    var d=window.claude&&await window.claude.use('downloads');
    if(d){await d.save({filename:filename(),data:blob});msg.textContent='';return;}
  }catch(e){if(e&&e.code==='declined'){return;}}
  // fallback
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename();
  document.body.appendChild(a);a.click();a.remove();
});

draw();
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('700 40px "Hind Siliguri"'),document.fonts.load('800 40px "Plus Jakarta Sans"'),document.fonts.load('500 26px "Plus Jakarta Sans"'),document.fonts.load('40px "Hind Siliguri"','আপনার নাম')]).then(draw).catch(function(){});
  document.fonts.ready.then(draw);
}
})();
</script>
</body>
</html>
